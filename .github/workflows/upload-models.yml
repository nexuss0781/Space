name: Upload GGUF models to HuggingFace

on:
  workflow_dispatch:

env:
  HF_USERNAME: Nexuss0781
  TARGET_REPO: SPACE
  DELETE_REPOS: Nexuss0781/SmolLM2-360M-Instruct-GGUF,Nexuss0781/Qwen2.5-3B-Instruct-GGUF

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install --upgrade "huggingface_hub>=0.25"

      - name: Upload GGUFs to single SPACE repo
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python models/upload/upload_gguf.py