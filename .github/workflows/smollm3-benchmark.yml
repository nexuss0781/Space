name: SmolLM GGUF Benchmark (micro + 3B)

on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/smollm3/**'
      - '.github/workflows/smollm3-benchmark.yml'

env:
  MAX_NEW_TOKENS: "256"
  REPORT_DIR: results

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen2.5-3b
            model_id: Qwen/Qwen2.5-3B-Instruct
            gguf_repo: QuantFactory/Qwen2.5-3B-Instruct-GGUF
            gguf_pattern: '*Q4_K_M*.gguf'
            gguf_dir: gguf/Qwen2.5-3B-Instruct

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache GGUF
        uses: actions/cache@v4
        with:
          path: gguf
          key: smollm-gguf-${{ matrix.name }}-v1

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install llama-cpp-python psutil huggingface_hub

      - name: Clone GGUF model (HF snapshot)
        env:
          GGUF_REPO: ${{ matrix.gguf_repo }}
          GGUF_PATTERN: ${{ matrix.gguf_pattern }}
          GGUF_DIR: ${{ matrix.gguf_dir }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['GGUF_REPO'],
              allow_patterns=os.environ['GGUF_PATTERN'],
              local_dir=os.environ['GGUF_DIR'],
          )
          PY
          find "$GGUF_DIR" -name '*.gguf' -exec ls -lh {} +

      - name: Run benchmark (10 prompts)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_ID: ${{ matrix.model_id }}
          GGUF_DIR: ${{ matrix.gguf_dir }}
          GGUF_REPO: ${{ matrix.gguf_repo }}
          GGUF_PATTERN: ${{ matrix.gguf_pattern }}
        run: |
          python benchmarks/smollm3/benchmark_smollm3.py \
            --model-id "$MODEL_ID" \
            --gguf-local-dir "$GGUF_DIR" \
            --gguf-repo "$GGUF_REPO" \
            --gguf-pattern "$GGUF_PATTERN" \
            --prompts-file benchmarks/smollm3/prompts.txt \
            --report-dir "$REPORT_DIR" \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --force-gguf

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-benchmark
          path: |
            results/**/*
          if-no-files-found: error