name: Vision Benchmark (5 candidates)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/vision/**'
      - '.github/workflows/vision-benchmark.yml'

env:
  MTMD_BIN: llama.cpp/build/bin/llama-mtmd-cli
  REPORT_DIR: results/vision
  MAX_NEW_TOKENS: "128"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smolvlm2-2.2b
            repo: ggml-org/SmolVLM2-2.2B-Instruct-GGUF
            model: SmolVLM2-2.2B-Instruct-Q4_K_M.gguf
            mmproj: mmproj-SmolVLM2-2.2B-Instruct-f16.gguf
            chat-template: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --upgrade psutil huggingface_hub

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llamacpp-mtmd-v2

      - name: Build llama.cpp (llama-mtmd-cli)
        run: |
          build_mtmd() {
            rm -rf llama.cpp
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
            cmake -S llama.cpp -B llama.cpp/build -DLLAMA_BUILD_COMMON=ON -DGGML_NATIVE=OFF
            cmake --build llama.cpp/build --target llama-mtmd-cli -j 4
          }
          if [ ! -f llama.cpp/build/bin/llama-mtmd-cli ]; then
            build_mtmd
          elif ! llama.cpp/build/bin/llama-mtmd-cli -h >/dev/null 2>&1; then
            echo "cached build not executable on this runner; rebuilding portable"
            build_mtmd
          fi
          ls -la llama.cpp/build/bin/llama-mtmd-cli

      - name: Run vision benchmark (10 image tasks)
        run: |
          python benchmarks/vision/benchmark_vision.py \
            --name "${{ matrix.name }}" \
            --source-repo "${{ matrix.repo }}" \
            --model-file "${{ matrix.model }}" \
            --mmproj-file "${{ matrix.mmproj }}" \
            --mtmd-bin "$MTMD_BIN" \
            --report-dir "$REPORT_DIR" \
            --max-new-tokens "$MAX_NEW_TOKENS" \
            --chat-template "${{ matrix.chat-template }}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: vision-${{ matrix.name }}
          path: |
            ${{ env.REPORT_DIR }}/**/*
          if-no-files-found: error

  merge:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all model reports
        uses: actions/download-artifact@v4
        with:
          pattern: vision-*
          path: artifacts
          merge-multiple: true

      - name: Merge into single paper
        run: |
          python benchmarks/vision/merge_vision.py artifacts --out reports/vision-benchmark.md

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: vision-merged-report
          path: reports/vision-benchmark.md
          if-no-files-found: error